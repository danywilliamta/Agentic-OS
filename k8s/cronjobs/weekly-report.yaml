apiVersion: batch/v1
kind: CronJob
metadata:
  name: weekly-report
  namespace: agent-harness
spec:
  # Schedule: Every Monday at 10:00 AM
  schedule: "0 10 * * 1"

  successfulJobsHistoryLimit: 4  # Keep 1 month of history
  failedJobsHistoryLimit: 2

  jobTemplate:
    spec:
      activeDeadlineSeconds: 900  # 15 minutes timeout
      backoffLimit: 1

      template:
        spec:
          restartPolicy: OnFailure

          containers:
          - name: agent-task
            image: your-registry/agent-harness:latest

            command:
            - python
            - run_scheduled_task.py
            - inventory-agent
            - system
            - "Génère un rapport hebdomadaire complet: stock, devis traités, commandes créées, et alertes sur les produits en rupture"

            env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: anthropic-api-key

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: database-url

            resources:
              requests:
                memory: "512Mi"  # More memory for reports
                cpu: "200m"
              limits:
                memory: "1Gi"
                cpu: "1000m"
