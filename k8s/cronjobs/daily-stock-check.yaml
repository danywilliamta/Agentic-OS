apiVersion: batch/v1
kind: CronJob
metadata:
  name: daily-stock-check
  namespace: agent-harness
  labels:
    app: agent-harness
    task: daily-stock-check
spec:
  # Schedule: Every day at 9:00 AM
  schedule: "0 9 * * *"

  # Timezone (optional, requires K8s 1.27+)
  # timeZone: "Europe/Paris"

  # Keep last 3 successful and 1 failed job for debugging
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1

  # Job template
  jobTemplate:
    metadata:
      labels:
        app: agent-harness
        task: daily-stock-check
    spec:
      # Timeout: abort if job takes more than 10 minutes
      activeDeadlineSeconds: 600

      # Retry policy
      backoffLimit: 2  # Retry 2 times on failure

      template:
        metadata:
          labels:
            app: agent-harness
            task: daily-stock-check
        spec:
          restartPolicy: OnFailure

          containers:
          - name: agent-task
            image: your-registry/agent-harness:latest
            imagePullPolicy: IfNotPresent

            # Command to run
            command:
            - python
            - run_scheduled_task.py
            - inventory-agent
            - system
            - "Vérifie le stock de tous les produits et alerte si un produit est en dessous de 10 unités"

            # Environment variables
            env:
            - name: ANTHROPIC_API_KEY
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: anthropic-api-key

            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: agent-secrets
                  key: database-url

            - name: PYTHONUNBUFFERED
              value: "1"

            # Resource limits
            resources:
              requests:
                memory: "256Mi"
                cpu: "100m"
              limits:
                memory: "512Mi"
                cpu: "500m"

            # Volume mounts (if needed for configs)
            volumeMounts:
            - name: agent-configs
              mountPath: /app/configs
              readOnly: true

          # Volumes
          volumes:
          - name: agent-configs
            configMap:
              name: agent-configs
