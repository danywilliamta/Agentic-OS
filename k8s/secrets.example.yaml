# Example secrets file
# DO NOT commit actual secrets to git!
# Create the real secrets.yaml and add it to .gitignore

apiVersion: v1
kind: Secret
metadata:
  name: agent-secrets
  namespace: agent-harness
type: Opaque
stringData:
  anthropic-api-key: "sk-ant-api03-xxxxx"  # Replace with actual key
  database-url: "postgresql://user:pass@postgres:5432/agent_db"  # Replace with actual URL

---
# Alternative: Create secret from command line
# kubectl create secret generic agent-secrets \
#   --from-literal=anthropic-api-key='sk-ant-api03-xxxxx' \
#   --from-literal=database-url='postgresql://user:pass@postgres:5432/agent_db' \
#   --namespace=agent-harness
