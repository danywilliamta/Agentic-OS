[project]
name = "agent-harness"
version = "0.1.0"
description = "Production-ready OS for LLM agents - Multi-agent orchestration, tool registry, and delegation"
readme = "README.md"
authors = [
    {name = "Dany-William TAGNE", email = "dany-william.tagne@mfglabs.com"}
]
requires-python = ">=3.11,<4.0"
license = {text = "MIT"}
keywords = ["ai", "agents", "llm", "langgraph", "orchestration", "multi-agent"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]

[tool.poetry]
package-mode = true
packages = [
    { include = "agent_harness" }
]

[tool.poetry.dependencies]
python = ">=3.11,<4.0"
# Core dependencies
deepagents = ">=0.6.12,<0.7.0"
langchain-anthropic = ">=1.4.8,<2.0.0"
python-dotenv = ">=1.2.2,<2.0.0"
PyYAML = ">=6.0,<7.0"
sqlalchemy = "^2.0.51"
# PDF support
PyPDF2 = ">=3.0.0,<4.0.0"
# API server
fastapi = ">=0.115.0,<1.0.0"
uvicorn = ">=0.32.0,<1.0.0"
# PostgreSQL support
psycopg = ">=3.0.0,<4.0.0"
psycopg-pool = ">=3.0.0,<4.0.0"
langgraph-checkpoint-postgres = "^3.1.0"
# SQLite support
langgraph-checkpoint-sqlite = "^3.1.0"
# Scheduler
apscheduler = "^3.11.3"
# HTTP requests
requests = "^2.31.0"
# Web search
langchain-tavily = ">=0.2.0,<1.0.0"

[tool.poetry.group.dev.dependencies]
pytest = "^7.4.0"
pytest-asyncio = "^0.21.0"
black = "^23.0.0"
ruff = "^0.1.0"

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
