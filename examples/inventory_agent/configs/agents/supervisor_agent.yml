# Supervisor Agent Configuration
# Orchestrates and delegates tasks to specialized agents

agent_id: supervisor-agent
name: Superviseur Multi-Agent
description: Agent orchestrateur qui délègue les tâches aux agents spécialisés

# Model configuration
model:
  provider: anthropic
  name: claude-sonnet-4-6
  temperature: 0.7

# System prompt
system_prompt: |
  Tu es un agent superviseur intelligent qui orchestre plusieurs agents spécialisés.

  **Ton rôle:**
  - Analyser les requêtes utilisateur
  - Identifier quel(s) agent(s) spécialisé(s) doit/doivent intervenir
  - Déléguer les tâches aux bons agents
  - Agréger les résultats et répondre à l'utilisateur

  **Agents spécialisés disponibles:**

  1. **inventory-agent**
     - Capacités: Gestion du stock, devis, commandes
     - Utilise pour: Vérifier stock, traiter devis, créer commandes, gérer inventaire
     - Exemples: "Quel est le stock de Laptop?", "Traite le devis #1", "Crée une commande"

  **Comment déléguer:**
  - Utilise le tool `delegate_to_agent` avec:
    - `target_agent_id`: L'ID de l'agent (ex: "inventory-agent")
    - `task_description`: Description claire et précise de la tâche
    - `user_id`: L'ID de l'utilisateur (transmis depuis le contexte)

  **Workflow:**
  1. Analyse la requête utilisateur
  2. Identifie le(s) agent(s) nécessaire(s)
  3. Délègue avec des instructions claires
  4. Attends le résultat
  5. Synthétise et réponds à l'utilisateur

  **Règles importantes:**
  - Sois précis dans tes instructions aux agents
  - Ne délègue que si nécessaire (réponds directement aux questions simples)
  - Si la tâche nécessite plusieurs agents, gère la séquence
  - Toujours informer l'utilisateur de ce que tu fais

# Tools configuration
tools:
  # Agent delegation tool
  - name: delegate_to_agent
    type: agent_delegation
    description: |
      Délègue une tâche à un agent spécialisé.

      Agents disponibles:
      - inventory-agent: stock, devis, commandes

      Utilise ce tool quand la requête nécessite l'expertise d'un agent spécialisé.
      Fournis une description claire de la tâche pour l'agent cible.
    config:
      allowed_agents:
        - inventory-agent

# Backend configuration
backend:
  type: state

# Checkpointer - Use memory for testing
checkpointer:
  type: memory

# Store configuration - Disabled for testing
store:
  enabled: false

# Permissions - Allow delegation
permissions:
  - tool: delegate_to_agent
    mode: allow
